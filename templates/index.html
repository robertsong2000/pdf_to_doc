<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文档工具集 - PDF转换 & DOCX合并</title>
    <style>
        /* Tab Navigation Styles */
        .tab-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            margin: 50px auto;
            max-width: 900px;
            overflow: hidden;
        }

        .tab-header {
            display: flex;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
        }

        .tab-button {
            flex: 1;
            padding: 20px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            font-weight: 600;
            color: #666;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .tab-button:hover {
            background: #e9ecef;
            color: #667eea;
        }

        .tab-button.active {
            background: white;
            color: #667eea;
            border-bottom: 3px solid #667eea;
        }

        .tab-content {
            display: none;
            padding: 40px;
        }

        .tab-content.active {
            display: block;
        }

        .tab-icon {
            font-size: 24px;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .converter-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            margin-top: 50px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 60px 20px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            background: #f8f9ff;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f2ff;
        }

        .upload-area.dragover {
            border-color: #764ba2;
            background: #e8ebff;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 64px;
            color: #667eea;
            margin-bottom: 20px;
        }

        .file-input {
            display: none;
        }

        .btn-convert {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 12px 40px;
            font-size: 18px;
            border-radius: 50px;
            transition: all 0.3s ease;
        }

        .btn-convert:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);

        }

        .btn-convert:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .btn-outline-primary {
            color: #667eea;
            border-color: #667eea;
        }

        .btn-outline-primary:hover {
            background-color: #667eea;
            border-color: #667eea;
            color: white;
        }

        .progress-container {
            margin-top: 20px;
            display: none;
        }

        .progress-header {
            margin-bottom: 10px;
        }

        .progress-text {
            display: flex;

            font-weight: bold;
        }

        .progress-percentage {

        }

        .progress-label {

        .progress {

            overflow: hidden;
            background-color: #e9ecef;

        .progress-bar {
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);

        .status-message {
            margin-top: 15px;

            font-weight: 500;
        }

        .status-message.info {
            background: #d1ecf1;

        }

        .status-message.success {

            border: 1px solid #c3e6cb;
        }

        .status-message.error {

        .status-message.warning {

        .file-info {

            border-radius: 8px;

        .download-btn {

            border-radius: 50px;

        }

        .download-btn:hover {
            background: #218838;

            color: white;
        }

        .btn-outline-danger {
            color: #dc3545;
            border-color: #dc3545;
        }

        .btn-outline-danger:hover {
            background-color: #dc3545;
            border-color: #dc3545;
            color: white;
        }

        .btn-lg {
            padding: 0.5rem 1rem;
            font-size: 1.25rem;
            border-radius: 0.3rem;
        }

        .btn-sm {
            padding: 0.25rem 0.5rem;

        .title-icon {

        }

        .feature i {

        .loading-spinner {

            0% { transform: rotate(0deg); }

        .hidden {

        }

        /* Basic button styles */
        button {
            background: none;
            border: none;
            cursor: pointer;
        }

        /* Text utility classes */
        .text-muted {
            color: #6c757d !important;
        }

        .text-center {
            text-align: center !important;
        }

        .text-success {
            color: #28a745 !important;

        .text-danger {
            color: #dc3545 !important;

        .mb-2 {

        }

        }

        .mt-4 {

        }

        .ms-2 {
            margin-left: 0.5rem !important;
        }

        /* Flex utilities */
        .d-inline-flex {
            display: inline-flex !important;
        }

        .d-flex {
            display: flex !important;
        }

        .justify-content-between {
            justify-content: space-between !important;
        }

        .align-items-center {
            align-items: center !important;
        }

        .fw-bold {
            font-weight: bold !important;
        }

        /* DOCX Merge Tool Styles */
        .merge-upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;

        .merge-upload-area:hover {

        .merge-upload-area.dragover {

        .merge-upload-icon {

        }

        .merge-upload-text {

        .file-list {

        .file-item {

        }

        .file-info {
            display: flex;
            align-items: center;

        }

        .file-icon {

        }

        .file-name {

        }

        .remove-btn {
            background: none;

            color: #dc3545;
            cursor: pointer;
            font-size: 20px;
            padding: 4px 8px;
            transition: all 0.2s;
        }

        .remove-btn:hover {
            color: #c82333;

        .total-size-info {
            display: flex;

            align-items: center;

        .merge-options {
            display: flex;

            margin-bottom: 20px;

            flex-wrap: wrap;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: #333;
            font-size: 14px;
        }

        .checkbox-label input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-group input {
            padding: 8px 12px;

            border-radius: 6px;

        .input-group input:focus {
            outline: none;

        .empty-state {
            text-align: center;
            color: #999;
            padding: 20px;

        }

        .result-success {
            background: #d4edda;
            color: #155724;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin-top: 20px;
        }

            background: #f8d7da;
            color: #721c24;
            padding: 20px;
            border-radius: 8px;

    </style>
</head>
<body>
    <div class="container">
        <div class="tab-container">
            <!-- Tab Header -->
            <div class="tab-header">
                <button class="tab-button active" data-tab="pdf-converter">
                    <span class="tab-icon">📄</span>
                    PDF 转 DOCX
                </button>
                <button class="tab-button" data-tab="docx-merger">
                    <span class="tab-icon">📋</span>
                    DOCX 文件合并
                </button>
            </div>

            <!-- Tab Content: PDF to DOCX Converter -->
            <div class="tab-content active" id="pdf-converter">
                <div class="converter-container" style="box-shadow: none; margin: 0; padding: 0; max-width: none;">
            <div class="text-center mb-4">
                <h1 class="d-inline-flex align-items-center">
                    <span class="title-icon">📄</span>
                    PDF to DOCX Converter
                </h1>
                <p class="text-muted mt-2">快速、简单、安全的PDF转DOCX在线转换工具</p>
            </div>

            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">☁️</div>
                <h3>拖拽PDF文件到这里</h3>
                <p class="text-muted">或者点击选择文件</p>
                <button type="button" class="btn-outline-primary btn-lg">
                    📁 选择文件
                </button>
                <input type="file" id="fileInput" class="file-input" accept=".pdf">
                <p class="text-muted mt-3 mb-0">支持最大 80MB 的PDF文件</p>
            </div>

            <div class="file-info hidden" id="fileInfo">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <span class="text-danger">📄</span>
                        <span id="fileName" class="fw-bold"></span>
                        <span id="fileSize" class="text-muted ms-2"></span>
                    </div>
                    <button type="button" class="btn-outline-danger btn-sm" id="removeFile">
                        ✕ 移除
                    </button>
                </div>
            </div>

            <div class="page-range-container hidden" id="pageRangeContainer" style="margin-top: 20px; padding: 20px; background: #f8f9ff; border-radius: 12px; border: 1px solid #e0e5ff;">
                <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
                    <span style="font-size: 18px;">📋</span>
                    <span style="font-weight: 600; color: #333;">页码范围</span>
                </div>
                <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
                    <label style="display: flex; align-items: center; gap: 6px; color: #555; font-size: 14px; cursor: pointer;">
                        <input type="radio" name="pageMode" value="all" id="pageModeAll" checked style="accent-color: #667eea;">
                        全部页面
                    </label>
                    <label style="display: flex; align-items: center; gap: 6px; color: #555; font-size: 14px; cursor: pointer;">
                        <input type="radio" name="pageMode" value="range" id="pageModeRange" style="accent-color: #667eea;">
                        指定页码
                    </label>
                </div>
                <div class="page-range-inputs" id="pageRangeInputs" style="display: none; margin-top: 12px; align-items: center; gap: 8px;">
                    <span style="color: #555; font-size: 14px;">第</span>
                    <input type="number" id="startPage" min="1" value="1" style="width: 70px; padding: 6px 10px; border: 1px solid #d0d5ff; border-radius: 8px; text-align: center; font-size: 14px; outline: none;">
                    <span style="color: #555; font-size: 14px;">页到第</span>
                    <input type="number" id="endPage" min="1" value="1" style="width: 70px; padding: 6px 10px; border: 1px solid #d0d5ff; border-radius: 8px; text-align: center; font-size: 14px; outline: none;">
                    <span style="color: #555; font-size: 14px;">页</span>
                </div>
            </div>

            <div class="text-center mt-4">
                <button type="button" class="btn-convert" id="convertBtn" disabled>
                    ✨ 开始转换
                </button>
            </div>

            <div class="progress-container" id="progressContainer">
                <div class="progress-header">
                    <div class="progress-text">
                        <span class="progress-percentage" id="progressPercentage">0%</span>
                        <span class="progress-label">转换进度</span>
                    </div>
                </div>
                <div class="progress">
                    <div class="progress-bar" id="progressBar" role="progressbar" style="width: 0%"></div>
                </div>
                <div class="status-message info" id="statusMessage">
                    ℹ️ <span id="statusText">准备转换...</span>
                </div>
            </div>

            <div class="text-center hidden" id="downloadContainer">
                <h4 class="text-success mb-3">
                    ✅ 转换完成！
                </h4>
                <button type="button" class="download-btn" id="downloadBtn">
                    ⬇️ 下载DOCX文件
                </button>
            </div>

            <div class="features">
                <div class="feature">
                    <div>⚡</div>
                    <h6>快速转换</h6>
                    <p class="text-muted mb-0">秒级处理速度</p>
                </div>
                <div class="feature">
                    <div>🔒</div>
                    <h6>安全可靠</h6>
                    <p class="text-muted mb-0">文件自动清理</p>
                </div>
                <div class="feature">
                    <div>📝</div>
                    <h6>保持格式</h6>
                    <p class="text-muted mb-0">保留原始布局</p>
                </div>
            </div>
                </div>
            </div>

            <!-- Tab Content: DOCX Merger -->
            <div class="tab-content" id="docx-merger">
                <div style="padding: 20px;">
                    <div class="text-center mb-4">
                        <h1 style="display: inline-flex; align-items: center; font-size: 28px; color: #333; margin-bottom: 10px;">
                            <span style="font-size: 48px; color: #667eea; margin-right: 15px;">📋</span>
                            DOCX 文件合并工具
                        </h1>
                        <p style="color: #666; margin-top: 10px;">上传多个Word文档，一键合并为一个文件</p>
                    </div>

                    <div class="merge-upload-area" id="mergeUploadArea">
                        <div class="merge-upload-icon">📄</div>
                        <div class="merge-upload-text">点击或拖拽文件到这里</div>
                        <div class="merge-upload-hint">支持 .docx 格式，可同时选择多个文件</div>
                    </div>

                    <input type="file" id="mergeFileInput" multiple accept=".docx" style="display: none;">

                    <div class="file-list" id="mergeFileList">
                        <div class="empty-state">尚未选择文件</div>
                    </div>

                    <div class="merge-options">
                        <label class="checkbox-label">
                            <input type="checkbox" id="pageBreak" checked>
                            文档之间添加分页符
                        </label>
                        <div class="input-group">
                            <input type="text" id="outputName" placeholder="输出文件名 (可选)" value="merged.docx">
                        </div>
                    </div>

                    <div class="text-center">
                        <button class="btn-convert" id="mergeBtn" disabled style="margin-top: 20px;">
                            🔄 开始合并
                        </button>
                    </div>

                    <div id="mergeResult" style="display: none;"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // Tab Switching Logic
        // ============================================================
        const tabButtons = document.querySelectorAll('.tab-button');
        const tabContents = document.querySelectorAll('.tab-content');

        tabButtons.forEach(button => {
            button.addEventListener('click', () => {
                const targetTab = button.getAttribute('data-tab');

                // Remove active class from all buttons and contents
                tabButtons.forEach(btn => btn.classList.remove('active'));
                tabContents.forEach(content => content.classList.remove('active'));

                // Add active class to clicked button and target content
                button.classList.add('active');
                document.getElementById(targetTab).classList.add('active');
            });
        });

        // ============================================================
        // PDF to DOCX Converter Logic
        // ============================================================
        let selectedFile = null;
        let currentTaskId = null;
        let isConverting = false;

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const convertBtn = document.getElementById('convertBtn');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const removeFileBtn = document.getElementById('removeFile');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const statusMessage = document.getElementById('statusMessage');
        const statusText = document.getElementById('statusText');
        const downloadContainer = document.getElementById('downloadContainer');
        const downloadBtn = document.getElementById('downloadBtn');
        const pageRangeContainer = document.getElementById('pageRangeContainer');
        const pageRangeInputs = document.getElementById('pageRangeInputs');
        const pageModeAll = document.getElementById('pageModeAll');
        const pageModeRange = document.getElementById('pageModeRange');
        const startPageInput = document.getElementById('startPage');
        const endPageInput = document.getElementById('endPage');

        // Page mode toggle
        document.querySelectorAll('input[name="pageMode"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                if (e.target.value === 'range') {
                    pageRangeInputs.style.display = 'flex';
                } else {
                    pageRangeInputs.style.display = 'none';
                }
            });
        });

        // Upload area click
        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        // File input change
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                handleFileSelect(file);
            }
        });

        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');

            const file = e.dataTransfer.files[0];
            if (file && file.type === 'application/pdf') {
                handleFileSelect(file);
            } else {
                alert('请选择PDF文件');
            }
        });

        // Remove file
        removeFileBtn.addEventListener('click', () => {
            resetUpload();
        });

        // Convert button
        convertBtn.addEventListener('click', () => {
            if (selectedFile) {
                convertFile();
            }
        });

        // Download button
        downloadBtn.addEventListener('click', () => {
            if (currentTaskId) {
                window.location.href = `/api/download/${currentTaskId}`;
                setTimeout(() => {
                    cleanupFiles();
                }, 1000);
            }
        });

        function handleFileSelect(file) {
            if (file.type !== 'application/pdf') {
                alert('请选择PDF文件');
                return;
            }

            if (file.size > 80 * 1024 * 1024) {
                alert('文件大小不能超过80MB');
                return;
            }

            selectedFile = file;
            fileName.textContent = file.name;
            fileSize.textContent = `(${formatFileSize(file.size)})`;

            uploadArea.classList.add('hidden');
            fileInfo.classList.remove('hidden');
            pageRangeContainer.classList.remove('hidden');
            convertBtn.disabled = false;

            resetProgress();
        }

        function resetUpload() {
            selectedFile = null;
            fileInput.value = '';
            uploadArea.classList.remove('hidden');
            fileInfo.classList.add('hidden');
            pageRangeContainer.classList.add('hidden');
            convertBtn.disabled = true;
            isConverting = false;
            resetProgress();
        }

        function resetProgress() {
            progressContainer.classList.add('hidden');
            downloadContainer.classList.add('hidden');
            statusMessage.className = 'status-message info';

            // Clear detailed status elements
            const stepIndicator = document.getElementById('stepIndicator');
            const progressPercent = document.getElementById('progressPercent');
            if (stepIndicator) stepIndicator.remove();
            if (progressPercent) progressPercent.remove();
        }

        async function convertFile() {
            if (!selectedFile || isConverting) return;

            isConverting = true;

            const formData = new FormData();
            formData.append('file', selectedFile);

            // Append page range if specified
            if (pageModeRange.checked) {
                const startVal = parseInt(startPageInput.value);
                const endVal = parseInt(endPageInput.value);
                if (startVal > 0 && endVal > 0 && endVal >= startVal) {
                    formData.append('start_page', startVal);
                    formData.append('end_page', endVal);
                } else {
                    alert('请输入有效的页码范围（起始页不能大于结束页）');
                    isConverting = false;
                    convertBtn.disabled = false;
                    convertBtn.innerHTML = '✨ 开始转换';
                    return;
                }
            }

            convertBtn.disabled = true;
            convertBtn.innerHTML = '<span class="loading-spinner"></span>处理中...';
            progressContainer.classList.remove('hidden');

            // 显示详细的初始状态
            updateDetailedStatus({
                message: '📤 正在上传文件到服务器...',
                progress: 5,
                step: 'uploading',
                status: 'converting'
            });

            try {
                // 显示上传进行中的状态
                updateDetailedStatus({
                    message: '📡 正在传输文件数据...',
                    progress: 8,
                    step: 'transferring',
                    status: 'converting'
                });

                const response = await fetch('/api/convert', {
                    method: 'POST',
                    body: formData
                });

                // 上传完成，等待服务器处理
                updateDetailedStatus({
                    message: '⏳ 服务器正在准备转换...',
                    progress: 10,
                    step: 'preparing',
                    status: 'converting'
                });

                const result = await response.json();

                if (response.ok) {
                    currentTaskId = result.task_id;
                    updateDetailedStatus({
                        message: '✅ 文件上传成功，启动转换引擎...',
                        progress: 15,
                        step: 'upload_complete',
                        status: 'converting'
                    });
                    pollConversionStatus();
                } else {
                    throw new Error(result.error || '上传失败');
                }
            } catch (error) {
                updateDetailedStatus({
                    message: `❌ 上传失败: ${error.message}`,
                    progress: 0,
                    step: 'error',
                    status: 'error'
                });
                convertBtn.disabled = false;
                convertBtn.innerHTML = '✨ 开始转换';
                isConverting = false;
            }
        }

        async function pollConversionStatus() {
            if (!currentTaskId) return;

            try {
                // Send heartbeat to indicate frontend is still active
                try {
                    await fetch(`/api/heartbeat/${currentTaskId}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        }
                    });
                } catch (heartbeatError) {
                    console.warn('Failed to send heartbeat:', heartbeatError);
                }
                
                const response = await fetch(`/api/status/${currentTaskId}`);
                const status = await response.json();

                if (response.ok) {
                    if (status.status === 'converting') {
                        updateDetailedStatus(status);
                        
                        // Adjust polling frequency based on current step
                        let pollInterval = 3000; // Default 3 seconds
                        if (status.step === 'processing_pages' || status.step === 'processing_pages_fallback') {
                            pollInterval = 2000; // More frequent updates during page processing
                        }
                        
                        setTimeout(pollConversionStatus, pollInterval);
                    } else if (status.status === 'completed') {
                    updateDetailedStatus(status);
                    statusMessage.className = 'status-message success';
                    convertBtn.innerHTML = '✅ 转换完成';
                    downloadContainer.classList.remove('hidden');
                    isConverting = false;
                    
                    // Clean up page progress display
                    const pageProgress = document.getElementById('pageProgress');
                    if (pageProgress) {
                        pageProgress.remove();
                    }
                    } else if (status.status === 'error') {
                        updateDetailedStatus(status);
                        statusMessage.className = 'status-message error';
                        convertBtn.disabled = false;
                        convertBtn.innerHTML = '✨ 重新转换';
                        isConverting = false;
                    } else if (status.status === 'cancelled') {
                        updateDetailedStatus(status);
                        statusMessage.className = 'status-message warning';
                        convertBtn.disabled = false;
                        convertBtn.innerHTML = '✨ 重新转换';
                        isConverting = false;
                    }
                }
            } catch (error) {
                updateStatus('获取状态失败', 'error', 0);
                convertBtn.disabled = false;
                convertBtn.innerHTML = '✨ 重新转换';
                isConverting = false;
            }
        }

        function updateStatus(message, type, progress) {
            statusText.textContent = message;
            statusMessage.className = `status-message ${type}`;
            progressBar.style.width = `${progress}%`;
            progressBar.setAttribute('aria-valuenow', progress);
        }

        function updateDetailedStatus(data) {
            const { message, progress, step, status } = data;

            statusText.textContent = message;
            let statusClass = 'info';
            if (status === 'error') statusClass = 'error';
            else if (status === 'cancelled') statusClass = 'warning';
            
            statusMessage.className = `status-message ${statusClass}`;
            progressBar.style.width = `${progress}%`;
            progressBar.setAttribute('aria-valuenow', progress);

            // Update main progress percentage display
            const progressPercentage = document.getElementById('progressPercentage');
            if (progressPercentage) {
                progressPercentage.textContent = `${progress}%`;
            }

            // Add step indicator
            const stepIndicator = document.getElementById('stepIndicator');
            if (!stepIndicator) {
                const stepDiv = document.createElement('div');
                stepDiv.id = 'stepIndicator';
                stepDiv.style.fontSize = '0.9em';
                stepDiv.style.color = '#666';
                stepDiv.style.marginTop = '5px';
                statusMessage.appendChild(stepDiv);
            }

            const stepElement = document.getElementById('stepIndicator');
            if (stepElement && step) {
                // Show step description based on step name
                const stepDescriptions = {
                    'uploading': '📤 正在上传文件',
                    'transferring': '📡 正在传输数据',
                    'preparing': '⏳ 服务器准备中',
                    'upload_complete': '✅ 文件上传成功',
                    'initialization': '🚀 开始初始化',
                    'initializing': '🔧 设置转换器',
                    'opening_document': '📂 打开PDF文档',
                    'analyzing_document': '🔍 分析文档结构',
                    'extracting_content': '📝 提取内容元素',
                    'converting_elements': '🔄 转换PDF元素',
                    'preserving_formatting': '🎨 保留格式布局',
                    'generating_docx': '📄 生成Word文档',
                    'processing_pages': '📖 处理PDF页面',
                    'processing_pages_fallback': '📖 处理PDF页面 (备用模式)',
                    'finalizing': '✨ 完成处理',
                    'completed': '✅ 转换完成',
                    'error': '❌ 发生错误'
                };

                stepElement.textContent = stepDescriptions[step] || `Step: ${step}`;
                
                // Show page progress if available
                if (data.current_page && data.total_pages) {
                    const pageProgress = document.getElementById('pageProgress');
                    if (!pageProgress) {
                        const pageDiv = document.createElement('div');
                        pageDiv.id = 'pageProgress';
                        pageDiv.style.fontSize = '0.85em';
                        pageDiv.style.color = '#555';
                        pageDiv.style.marginTop = '3px';
                        pageDiv.style.fontWeight = 'bold';
                        statusMessage.appendChild(pageDiv);
                    }
                    
                    const pageElement = document.getElementById('pageProgress');
                    if (pageElement) {
                        // Create a mini progress bar for pages
                        const pagePercent = Math.round((data.current_page / data.total_pages) * 100);
                        let etaHtml = '';
                        if (data.eta) {
                            etaHtml = `<div style="margin-top: 3px; color: #6c757d;">${data.eta}</div>`;
                        }
                        pageElement.innerHTML = `
                            <div>页面进度: ${data.current_page} / ${data.total_pages} (${pagePercent}%)</div>
                            <div style="background-color: #e9ecef; border-radius: 4px; height: 6px; margin-top: 3px; width: 100%;">
                                <div style="background-color: #28a745; height: 100%; border-radius: 4px; width: ${pagePercent}%; transition: width 0.3s;"></div>
                            </div>
                            ${etaHtml}
                        `;
                    }
                }
            }

            // Add progress percentage in status message (smaller one)
            const progressElement = document.getElementById('progressPercent');
            if (progressElement) {
                progressElement.textContent = `${progress}%`;
            } else {
                const progressDiv = document.createElement('div');
                progressDiv.id = 'progressPercent';
                progressDiv.style.fontSize = '0.8em';
                progressDiv.style.fontWeight = 'bold';
                progressDiv.style.marginTop = '5px';
                progressDiv.textContent = `${progress}%`;
                statusMessage.appendChild(progressDiv);
            }
        }

        async function cleanupFiles() {
            if (currentTaskId) {
                try {
                    await fetch(`/api/cleanup/${currentTaskId}`, {
                        method: 'DELETE'
                    });
                } catch (error) {
                    console.error('Cleanup failed:', error);
                }
            }
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // ============================================================
        // DOCX Merger Logic
        // ============================================================
        let mergeSelectedFiles = [];

        const mergeUploadArea = document.getElementById('mergeUploadArea');
        const mergeFileInput = document.getElementById('mergeFileInput');
        const mergeFileList = document.getElementById('mergeFileList');
        const mergeBtn = document.getElementById('mergeBtn');
        const mergeResult = document.getElementById('mergeResult');

        // Click upload area
        mergeUploadArea.addEventListener('click', () => {
            mergeFileInput.click();
        });

        // File input change
        mergeFileInput.addEventListener('change', (e) => {
            handleMergeFiles(e.target.files);
        });

        // Drag and drop
        mergeUploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            mergeUploadArea.classList.add('dragover');
        });

        mergeUploadArea.addEventListener('dragleave', () => {
            mergeUploadArea.classList.remove('dragover');
        });

        mergeUploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            mergeUploadArea.classList.remove('dragover');
            handleMergeFiles(e.dataTransfer.files);
        });

        function handleMergeFiles(files) {
            const MAX_TOTAL_SIZE = 200 * 1024 * 1024; // 200MB
            let currentTotalSize = mergeSelectedFiles.reduce((sum, f) => sum + f.size, 0);
            
            for (const file of files) {
                if (file.name.toLowerCase().endsWith('.docx')) {
                    if (!mergeSelectedFiles.find(f => f.name === file.name)) {
                        // Check if adding this file would exceed the limit
                        if (currentTotalSize + file.size > MAX_TOTAL_SIZE) {
                            alert(`文件总大小不能超过200MB。当前已选择${formatFileSize(currentTotalSize)}，添加${file.name}(${formatFileSize(file.size)})会超出限制`);
                            continue;
                        }
                        mergeSelectedFiles.push(file);
                        currentTotalSize += file.size;
                    }
                }
            }
            updateMergeFileList();
        }

        function updateMergeFileList() {
            const MAX_TOTAL_SIZE = 200 * 1024 * 1024; // 200MB
            
            if (mergeSelectedFiles.length === 0) {
                mergeFileList.innerHTML = '<div class="empty-state">尚未选择文件</div>';
                mergeBtn.disabled = true;
                return;
            }

            const totalSize = mergeSelectedFiles.reduce((sum, f) => sum + f.size, 0);
            const sizePercentage = Math.round((totalSize / MAX_TOTAL_SIZE) * 100);
            const sizeWarning = totalSize > MAX_TOTAL_SIZE * 0.8 ? 'text-warning' : '';
            
            mergeBtn.disabled = mergeSelectedFiles.length < 2 || totalSize > MAX_TOTAL_SIZE;
            mergeFileList.innerHTML = mergeSelectedFiles.map((file, index) => `
                <div class="file-item">
                    <div class="file-info">
                        <span class="file-icon">📄</span>
                        <span class="file-name">${file.name}</span>
                        <span class="file-size">(${formatFileSize(file.size)})</span>
                    </div>
                    <button class="remove-btn" onclick="removeMergeFile(${index})">&times;</button>
                </div>
            `).join('');
            
            // Add total size info
            mergeFileList.innerHTML += `
                <div class="total-size-info ${sizeWarning}">
                    <span>总大小: ${formatFileSize(totalSize)} / 200MB (${sizePercentage}%)</span>
                </div>
            `;
        }

        function removeMergeFile(index) {
            mergeSelectedFiles.splice(index, 1);
            updateMergeFileList();
        }

        // Merge button click
        mergeBtn.addEventListener('click', async () => {
            if (mergeSelectedFiles.length < 2) {
                showMergeResult('请至少选择2个文件进行合并', 'error');
                return;
            }

            const formData = new FormData();
            mergeSelectedFiles.forEach(file => formData.append('files', file));
            formData.append('page_break', document.getElementById('pageBreak').checked);

            const outputName = document.getElementById('outputName').value.trim();
            if (outputName) {
                formData.append('output_name', outputName);
            }

            // Show loading state
            mergeBtn.disabled = true;
            mergeBtn.innerHTML = '<span class="loading-spinner"></span>合并中...';

            try {
                const response = await fetch('/api/merge', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.status === 413) {
                    showMergeResult(data.error || '文件总大小超过限制', 'error');
                } else if (data.success) {
                    showMergeResult(`
                        <h4>✅ ${data.message}</h4>
                        <button class="download-btn" onclick="window.location.href='${data.download_url}'">
                            ⬇️ 下载合并后的文件
                        </button>
                    `, 'success');
                } else {
                    showMergeResult(data.error || '合并失败', 'error');
                }
            } catch (error) {
                showMergeResult('网络错误: ' + error.message, 'error');
            } finally {
                mergeBtn.disabled = false;
                mergeBtn.innerHTML = '🔄 开始合并';
            }
        });

        function showMergeResult(message, type) {
            mergeResult.style.display = 'block';
            mergeResult.className = type === 'success' ? 'result-success' : 'result-error';
            mergeResult.innerHTML = message;
        }

        // Add page unload event listener to stop backend processing when page is refreshed or closed
        window.addEventListener('beforeunload', function() {
            if (currentTaskId && isConverting) {
                // Use navigator.sendBeacon for reliable delivery during page unload
                const data = new FormData();
                navigator.sendBeacon(`/api/cancel/${currentTaskId}`, data);
            }
        });
    </script>
</body>
</html>
