<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文档工具集 - PDF转换 & DOCX合并 & CSV提取</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <div class="tab-container">
            <!-- Tab Header -->
            <div class="tab-header">
                <button class="tab-button active" data-tab="pdf-converter">
                    <span class="tab-icon">📄</span>
                    PDF 转 DOCX
                </button>
                <button class="tab-button" data-tab="docx-merger">
                    <span class="tab-icon">📋</span>
                    DOCX 文件合并
                </button>
                <button class="tab-button" data-tab="pdf-to-csv">
                    <span class="tab-icon">📊</span>
                    PDF 转 CSV
                </button>
                <button class="tab-button" data-tab="docx-to-csv">
                    <span class="tab-icon">📋</span>
                    DOCX 转 CSV
                </button>
            </div>

            {% include 'tabs/pdf_converter.html' %}
            {% include 'tabs/docx_merger.html' %}
            {% include 'tabs/pdf_to_csv.html' %}
            {% include 'tabs/docx_to_csv.html' %}
        </div>
    </div>

    <!-- Scripts: load in order (common first, then tab modules, then main for beforeunload) -->
    <script src="/static/js/common.js"></script>
    <script src="/static/js/pdf_converter.js"></script>
    <script src="/static/js/docx_merger.js"></script>
    <script src="/static/js/pdf_to_csv.js"></script>
    <script src="/static/js/docx_to_csv.js"></script>
    <script src="/static/js/main.js"></script>
</body>
</html>
